# Builds the plugin on a version tag, on pull requests and when started by hand. On a version tag
# (v1.2.3) it also checks that the tag matches package.json and attaches Vistazo.zip to a GitHub
# release, ready for Decky's "Install plugin from URL".
#
# No run on pushes to main: main only moves at a release, together with its tag, so that run built
# the same commit a second time.
#
# Two jobs on purpose. `build` installs and runs third-party packages, so it can only read the
# repository and keeps no credentials in the checkout. `release` is the only one allowed to write,
# runs nothing from the dependencies, and only on a tag. Actions are pinned to an exact commit.
name: Build and release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Runs on GitHub only; other forges skip it.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # version comes from "packageManager" in package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: ./pack.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Vistazo
          path: out/Vistazo.zip

  release:
    if: github.server_url == 'https://github.com' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the zip
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Vistazo

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Vistazo.zip --clobber
          else
            gh release create "$TAG" Vistazo.zip --title "$TAG" --generate-notes --verify-tag
          fi
