# Builds the plugin on every push and pull request. On a version tag (v1.2.3) it also checks that the
# tag matches package.json and attaches Vistazo.zip to a GitHub release, ready for Decky's
# "Install plugin from URL".
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Runs on GitHub only; other forges skip it.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the zip to the release; only used on tags
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1
          fi

      - uses: pnpm/action-setup@v4
        # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: ./pack.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Vistazo
          path: out/Vistazo.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/Vistazo.zip
          generate_release_notes: true
